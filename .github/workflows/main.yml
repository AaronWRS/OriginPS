name: Build Mac Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - name: Intel
            runner: macos-13
          - name: Apple-Silicon
            runner: macos-14

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: chmod +x gradlew
      - run: ./gradlew shadowJar --no-daemon
      - run: ./gradlew jpackageNative --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OriginPS-Mac-${{ matrix.name }}
          path: |
            build/native/*.dmg
            build/libs/OriginLauncher.jar
