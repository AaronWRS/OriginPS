name: Build Mac Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-mac:
    strategy:
      matrix:
        include:
          - name: Intel
            runner: macos-13
          - name: Apple-Silicon
            runner: macos-14

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Show files
        run: |
          pwd
          ls -la
          find . -maxdepth 2 -type f

      - name: Set Gradle permission
        run: chmod +x ./gradlew

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Build launcher JAR
        run: ./gradlew shadowJar --no-daemon

      - name: Build Mac DMG
        run: ./gradlew jpackageNative --no-daemon

      - name: Upload Mac files
        uses: actions/upload-artifact@v4
        with:
          name: OriginPS-Mac-${{ matrix.name }}
          path: |
            build/native/*.dmg
            build/libs/OriginLauncher.jar
